name: Node CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    env:
      JWT_SECRET: ci-test-secret
      PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Start server smoke check
        run: |
          npm start &
          for i in {1..10}; do
            if curl -sf http://localhost:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to respond"
          exit 1
